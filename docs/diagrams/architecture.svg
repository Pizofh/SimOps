<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1480" viewBox="0 0 1520 1480" role="img" aria-labelledby="title description">
<title id="title">SimOps: arquitectura del laboratorio</title><desc id="description">Aplicación y observabilidad en Docker Compose. El navegador consulta la API; el simulador escribe eventos en PostgreSQL mediante FastAPI. Prometheus obtiene métricas, Promtail lee logs y Grafana consulta Prometheus y Loki.</desc><rect width="100%" height="100%" fill="white"/>
